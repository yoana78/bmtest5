.bm-sales-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 40px rgba(0, 102, 179, 0.1);
  border-color: rgba(0, 102, 179, 0.3);
}

.bm-sales-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.bm-sales-team-badge {
  font-size: 0.78rem;
  font-weight: 800;
  color: #64748B;
  background: #F1F5F9;
  border: 1px solid #E2E8F0;
  padding: 4px 14px;
  border-radius: 20px;
  letter-spacing: 0.04em;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.bm-sales-card:hover .bm-sales-team-badge {
  color: #FFFFFF;
  background: var(--bm-primary);
  border-color: var(--bm-primary);
}

.bm-sales-scope-pill {
  font-size: 0.78rem;
  font-weight: 700;
  color: #64748B;
  background: #F1F5F9;
  border: 1px solid #E2E8F0;
  padding: 4px 12px;
  border-radius: 20px;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.bm-sales-card:hover .bm-sales-scope-pill {
  color: var(--bm-primary);
  background: #EBF5FF;
  border-color: rgba(0, 102, 179, 0.2);
}

.bm-sales-person-info {
  margin-bottom: 20px;
}

.bm-sales-person-name {
  font-size: 1.35rem;
  font-weight: 900;
  color: var(--bm-text-dark);
  margin-bottom: 4px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.bm-sales-person-title {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--bm-text-muted);
}

.bm-sales-scope-desc {
  font-size: 0.88rem;
  color: #64748B;
  line-height: 1.5;
  margin-top: 6px;
}

/* 명함 실물 프리뷰 컨테이너 */
.bm-sales-card-preview {
  position: relative;
  width: 100%;
  aspect-ratio: 936 / 520;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--bm-border);
  background: #F8FAFC;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  margin-bottom: 22px;
}

.bm-sales-card-preview:hover {
  transform: scale(1.02);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.1);
}

.bm-sales-card-preview img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.bm-sales-card-zoom-hint {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(10, 37, 64, 0.65);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #FFFFFF;
  font-size: 0.88rem;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.bm-sales-card-preview:hover .bm-sales-card-zoom-hint {
  opacity: 1;
}

/* 명함 하단 다이렉트 액션 버튼 그룹 */
.bm-sales-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.bm-sales-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 0.84rem;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid transparent;
}

.bm-sales-btn.primary {
  background: var(--bm-primary);
  color: #FFFFFF;
}

.bm-sales-btn.primary:hover {
  background: var(--bm-primary-dark);
  transform: translateY(-2px);
  box-shadow: 0 4px 14px rgba(0, 102, 179, 0.25);
}

.bm-sales-btn.secondary {
  background: #F8FAFC;
  color: var(--bm-text-dark);
  border-color: var(--bm-border);
}

.bm-sales-btn.secondary:hover {
  background: #EBF5FF;
  color: var(--bm-primary);
  border-color: var(--bm-primary);
  transform: translateY(-2px);
}

/* 4. 본사 안내 & 영업팀 좌우 분할 레이아웃 */
.bm-contact-team-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: stretch;
  max-width: 900px;
  margin: 0 auto 40px;
}

.bm-contact-team-split .bm-hq-card {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 0 0 24px 0;
  border-radius: 20px;
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
}

.bm-contact-team-split .bm-hq-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 40px rgba(0, 102, 179, 0.12);
  border-color: rgba(0, 102, 179, 0.3);
}

.bm-contact-team-split .bm-hq-title-wrap {
  text-align: center;
  margin-bottom: 20px;
  padding: 24px 20px 18px;
  border-bottom: 1px solid #F1F5F9;
  background: #FFFFFF;
  transition: background 0.3s ease, border-color 0.3s ease;
}

.bm-contact-team-split .bm-hq-card:hover .bm-hq-title-wrap {
  background: var(--bm-primary);
  border-bottom-color: var(--bm-primary);
}

.bm-contact-team-split .bm-hq-logo-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 10px;
}

.bm-contact-team-split .bm-hq-logo-img {
  height: 145px;
  max-width: 320px;
  object-fit: contain;
  display: block;
  transition: filter 0.3s ease, transform 0.3s ease;
}

/* 마우스 오버 시 로고가 순백색으로 변경 */
.bm-contact-team-split .bm-hq-card:hover .bm-hq-logo-img {
  filter: brightness(0) invert(1);
  transform: scale(1.03);
}

.bm-contact-team-split .bm-contact-tag {
  transition: color 0.3s ease;
}

.bm-contact-team-split .bm-hq-card:hover .bm-contact-tag {
  color: #FFFFFF;
}

.bm-contact-team-split .bm-hq-info-list {
  display: flex;
  flex-direction: column;
  gap: 13px;
  margin-bottom: 20px;
  padding: 0 24px;
  flex: 1;
}

.bm-contact-team-split .bm-hq-info-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.bm-contact-team-split .bm-hq-info-label {
  font-size: 0.74rem;
  font-weight: 700;
  color: #94A3B8;
  line-height: 1.3;
  margin-bottom: 2px;
  display: block;
}

.bm-contact-team-split .bm-hq-info-val {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--bm-text-dark);
  line-height: 1.4;
  word-break: keep-all;
}

.bm-contact-team-split .bm-hq-factory-box {
  padding: 14px 16px;
  margin: 0 24px;
}

.bm-contact-team-split .bm-hq-factory-head {
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--bm-navy);
  margin-bottom: 4px;
}

.bm-contact-team-split .bm-hq-factory-desc {
  font-size: 0.76rem;
  line-height: 1.45;
}

.bm-sales-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
  height: 100%;
}

.bm-sales-stack .bm-sales-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 18px 20px;
  border-radius: 16px;
}

.bm-sales-stack .bm-sales-card-head {
  margin-bottom: 10px;
}

.bm-sales-stack .bm-sales-person-name {
  font-size: 1.15rem;
  margin-bottom: 2px;
}

.bm-sales-stack .bm-sales-person-title {
  font-size: 0.8rem;
}

.bm-sales-stack .bm-sales-scope-desc {
  font-size: 0.8rem;
  line-height: 1.4;
  margin-top: 4px;
}

.bm-sales-stack .bm-sales-card-preview {
  margin-bottom: 0;
  max-width: 365px;
  margin-left: auto;
  margin-right: auto;
}

/* 폼 카드 전체 너비 확장 */
.bm-form-card.bm-form-card-full {
  max-width: 900px;
  margin: 0 auto;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
}

/* 기존 본사 안내 & B2B 폼 2열 레이아웃 호환 */
.bm-contact-main-grid {
  display: grid;
  grid-template-columns: 5fr 7fr;
  gap: 36px;
  margin-bottom: 90px;
  align-items: start;
}

/* 좌측 본사 안내 카드 */
.bm-hq-card {
  background: #FFFFFF;
  border: 1px solid var(--bm-border);
  border-radius: 20px;
  padding: 36px 32px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
}

.bm-hq-title-wrap {
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid #F1F5F9;
}

.bm-hq-title {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--bm-text-dark);
  margin-bottom: 6px;
}

.bm-hq-subtitle {
  font-size: 0.88rem;
  color: var(--bm-text-muted);
  line-height: 1.5;
}

.bm-hq-info-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 28px;
}

.bm-hq-info-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.bm-hq-info-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: #EBF5FF;
  color: var(--bm-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.05rem;
  flex-shrink: 0;
}

.bm-hq-info-text {
  flex: 1;
}

.bm-hq-info-label {
  font-size: 0.75rem;
  font-weight: 800;
  color: #94A3B8;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 2px;
  display: block;
}

.bm-hq-info-val {
  font-size: 0.94rem;
  font-weight: 700;
  color: var(--bm-text-dark);
  line-height: 1.45;
  word-break: keep-all;
}

.bm-hq-copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  background: #F1F5F9;
  border: 1px solid #CBD5E1;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 0.76rem;
  font-weight: 700;
  color: #475569;
  cursor: pointer;
  transition: all 0.2s ease;
}

.bm-hq-copy-btn:hover {
  background: var(--bm-primary);
  color: #FFFFFF;
  border-color: var(--bm-primary);
}

.bm-hq-map-links {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

.bm-hq-map-link {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--bm-primary);
  text-decoration: none;
  background: #EBF5FF;
  padding: 5px 12px;
  border-radius: 6px;
  transition: background 0.2s ease;
}

.bm-hq-map-link:hover {
  background: #0066B3;
  color: #FFFFFF;
}

/* 물류/공장 서브 안내 박스 */
.bm-hq-factory-box {
  background: #F8FAFC;
  border: 1px dashed var(--bm-border);
  border-radius: 12px;
  padding: 18px 20px;
  margin-top: 24px;
}

.bm-hq-factory-head {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--bm-navy);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.bm-hq-factory-desc {
  font-size: 0.82rem;
  color: var(--bm-text-muted);
  line-height: 1.5;
  margin: 0;
}

/* 우측 스마트 B2B 문의 폼 카드 */
.bm-form-card {
  background: #FFFFFF;
  border: 1px solid var(--bm-border);
  border-radius: 20px;
  padding: 36px 32px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
}

.bm-form-head {
  margin-bottom: 24px;
}

.bm-form-title {
  font-size: 1.35rem;
  font-weight: 900;
  color: var(--bm-text-dark);
  margin-bottom: 6px;
}

.bm-form-subtitle {
  font-size: 0.88rem;
  color: var(--bm-text-muted);
}

/* 문의 유형 선택 칩 탭 */
.bm-inquiry-chips-label {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--bm-navy);
  margin-bottom: 10px;
  display: block;
}

.bm-inquiry-chips {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}

.bm-inquiry-chip {
  padding: 12px 16px;
  border-radius: 12px;
  background: #F8FAFC;
  border: 1.5px solid var(--bm-border);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.86rem;
  font-weight: 700;
  color: var(--bm-text-dark);
  transition: all 0.2s ease;
  text-align: left;
}

.bm-inquiry-chip:hover {
  background: #F1F5F9;
  border-color: #CBD5E1;
}

.bm-inquiry-chip.active {
  background: #EBF5FF;
  border-color: var(--bm-primary);
  color: var(--bm-primary);
  box-shadow: 0 2px 10px rgba(0, 102, 179, 0.1);
}

.bm-form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.bm-form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.bm-form-row .bm-form-group {
  margin-bottom: 0;
}

.bm-form-group label {
  font-size: 0.84rem;
  font-weight: 800;
  color: var(--bm-text-dark);
}

.bm-form-group label .required {
  color: #DC2626;
  margin-left: 2px;
}

.bm-form-group input,
.bm-form-group select,
.bm-form-group textarea {
  width: 100%;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1.5px solid var(--bm-border);
  background: #FFFFFF;
  font-size: 0.9rem;
  color: var(--bm-text-dark);
  font-family: inherit;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  outline: none;
}

.bm-form-group input:focus,
.bm-form-group select:focus,
.bm-form-group textarea:focus {
  border-color: var(--bm-primary);
  box-shadow: 0 0 0 3px rgba(0, 102, 179, 0.12);
}

.bm-form-group textarea {
  resize: vertical;
  min-height: 120px;
  line-height: 1.5;
}

/* 개인정보 동의 체크박스 */
.bm-privacy-check {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 20px 0 24px;
  cursor: pointer;
  user-select: none;
}

.bm-privacy-check input[type="checkbox"] {
  margin-top: 3px;
  accent-color: var(--bm-primary);
  width: 16px;
  height: 16px;
  cursor: pointer;
}

.bm-privacy-check span {
  font-size: 0.82rem;
  color: var(--bm-text-muted);
  line-height: 1.45;
}

/* 제출 버튼 */
.bm-form-submit-btn {
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  background: var(--bm-primary);
  color: #FFFFFF;
  font-size: 1rem;
  font-weight: 800;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 6px 20px rgba(0, 102, 179, 0.25);
  transition: all 0.25s ease;
}

.bm-form-submit-btn:hover:not(:disabled) {
  background: var(--bm-primary-dark);
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(0, 102, 179, 0.35);
}

.bm-form-submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* 5. B2B 파트너십 FAQ 아코디언 */
.bm-faq-section {
  margin-bottom: 90px;
}

.bm-faq-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.bm-faq-item {
  background: #FFFFFF;
  border: 1px solid var(--bm-border);
  border-radius: 14px;
  overflow: hidden;
  transition: all 0.25s ease;
}

.bm-faq-item.open {
  border-color: var(--bm-primary);
  box-shadow: 0 4px 18px rgba(0, 102, 179, 0.08);
}

.bm-faq-question {
  width: 100%;
  padding: 20px 24px;
  background: none;
  border: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  text-align: left;
  font-size: 1.02rem;
  font-weight: 800;
  color: var(--bm-text-dark);
  transition: color 0.2s ease;
}

.bm-faq-item.open .bm-faq-question {
  color: var(--bm-primary);
}

.bm-faq-arrow {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #F1F5F9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  color: #64748B;
  flex-shrink: 0;
  transition: transform 0.3s ease, background 0.2s ease, color 0.2s ease;
}

.bm-faq-item.open .bm-faq-arrow {
  transform: rotate(180deg);
  background: #EBF5FF;
  color: var(--bm-primary);
}

.bm-faq-answer {
  padding: 0 24px 22px;
  font-size: 0.92rem;
  color: #475569;
  line-height: 1.65;
  border-top: 1px solid #F1F5F9;
  padding-top: 16px;
}

/* 6. 명함 마우스 오버 시 화면 정중앙 확대 오버레이 */
.bm-card-hover-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(10, 37, 64, 0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.28s ease;
}

.bm-card-hover-overlay.active {
  opacity: 1;
  visibility: visible;
}

.bm-card-hover-center-box {
  background: #FFFFFF;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(0, 102, 179, 0.15);
  max-width: min(90vw, 680px);
  width: 100%;
  transform: scale(0.92);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.bm-card-hover-overlay.active .bm-card-hover-center-box {
  transform: scale(1);
}

.bm-card-hover-img-wrap {
  width: 100%;
  aspect-ratio: 936 / 520;
  border-radius: 12px;
  overflow: hidden;
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
}

.bm-card-hover-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.bm-card-hover-caption {
  display: flex;
  align-items: center;
  gap: 12px;
}

.bm-card-hover-badge {
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: #FFFFFF;
  background: var(--bm-primary);
  padding: 4px 10px;
  border-radius: 20px;
}

.bm-card-hover-title {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--bm-text-dark);
}

/* 반응형 모바일/태블릿 */
@media (max-width: 1024px) {
  .bm-contact-main-grid {
    grid-template-columns: 1fr;
  }
  .bm-contact-team-split {
    grid-template-columns: 1fr;
    gap: 28px;
  }
}

@media (max-width: 768px) {
  .bm-sales-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .bm-contact-team-split {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .bm-inquiry-chips {
    grid-template-columns: 1fr;
  }
  .bm-form-row {
    grid-template-columns: 1fr;
    gap: 0;
  }
  .bm-form-card,
  .bm-hq-card {
    padding: 24px 20px;
  }
  .bm-sales-actions {
    grid-template-columns: 1fr;
  }
  .bm-contact-kpi-bar {
    grid-template-columns: 1fr;
    margin-top: -24px;
    gap: 12px;
  }
  .bm-contact-kpi-pill {
    padding: 14px 20px;
    font-size: 1.05rem;
    white-space: normal;
